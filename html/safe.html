<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Keyboard Game Layout</title>
    <style>
        /* ==========================================
           1. BASE LAYOUT & GRID (From safe.html)
           ========================================== */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* The specific layout container for tracking characters */
        #keyboard-row-div {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            
            /* CRITICAL FIXES: These keep the falling letters trapped inside */
            position: relative; 
            overflow: hidden; 
        }

        /* ==========================================
           2. FALLING ANIMATION STYLE (From what.html)
           ========================================== */
        .falling-letter {
            position: absolute;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            pointer-events: none; /* Prevents character spans from blocking mouse actions */
            animation: dropTime 2.5s linear forwards;
        }

        @keyframes dropTime {
            0% {
                top: -40px;
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main row div that handles layout AND isolates the falling characters -->
        <div id="keyboard-row-div">
            <span id="display-character">Press any key to start</span>
        </div>
    </div>

    <!-- ==========================================
       3. COMBINED JAVASCRIPT MECHANICS
       ========================================== -->
    <script>
        // Get references to elements inside the layout
        const keyboardContainer = document.getElementById('keyboard-row-div');
        const displayCharacter = document.getElementById('display-character');

        // Function that spawns the falling animation mechanics (Logic from what.html)
        function triggerFallingLetter(keyString) {
            const letter = document.createElement('span');
            letter.textContent = keyString;
            letter.classList.add('falling-letter');

            // Calculate boundaries relative only to the row container box width
            const containerWidth = keyboardContainer.clientWidth;
            const randomXPosition = Math.random() * (containerWidth - 30);
            
            letter.style.left = `${randomXPosition}px`;

            // Append directly inside the keyboard row element to isolate it
            keyboardContainer.appendChild(letter);

            // Clean up the node automatically after the animation finishes
            letter.addEventListener('animationend', () => {
                letter.remove();
            });
        }

        // Global Event Listener (Inputs from safe.html)
        window.addEventListener('keydown', (event) => {
            // Filter out system command keys (Shift, Alt, etc.) to capture standard symbols
            if (event.key.length === 1) {
                // Action A: Safely update the layout text
                displayCharacter.textContent = event.key;

                // Action B: Fire off the contained animation drop sequence 
                triggerFallingLetter(event.key);
            }
        });
    </script>
</body>
</html>
