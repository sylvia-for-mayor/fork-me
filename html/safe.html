<script>


	var container = document.querySelector('container');

	var score = document.getElementById('score');
	var misses = document.getElementById('misses');
	var gremlin = document.getElementById('gremlin');

	//so we need a global var for each one
	var output = document.getElementById('gremlin').innerText;

	//keyboard 
	const keys = document.getElementById('row-keys');
	const el = document.createElement('div');

	var activeLetters = [];
		
	let randomLetter = ' ';
	let isPaused = false;
	

	function populate_keys() {
		const keys = document.getElementById('row-keys');
		if (keys) {
				keyboard_el.forEach(item => {
				const new_div = document.createElement('div');	
					new_div.id = item.id;
					new_div.className = 'overlay-text';
					new_div.textContent = item.text;
					new_div.style.left = item.x + "px";
					new_div.style.top = item.y + "px";
					//hidden stops them from showing, 
					//for now lets see how they look
					//new_div.classList.add('hidden');
					keys.appendChild(new_div);
				}); //foreach keboard elemtent
		}//if keys
		
	} //end populate_keys
	/* And run it once */
	populate_keys(); 
	/************************************************/



	function create_letter() {
		if (isPaused) return;
		const matrix = 
		[alpha, alpha_shift, numbers, 
		numbers_shift, symbols];

		/* randomize which array to choose */
		const which = Math.floor(
			Math.random() 
			* matrix.length
		);
		const row = matrix[which];

		/* randomize element from 
		   that specific array */
		const index = Math.floor(Math.random() * row.length);
		element = row[index];

		/* assign the actual element just 
		randomized to randomLetter */
		randomLetter = element;
		let char = randomLetter;

		var el = document.createElement('div');
		el.classList.add('falling-letter');
		el.innerText = randomLetter;

		let random_percent = Math.random() * 95;
		el.style.left = `${random_percent}%`;
		console.log(el.style.left);

		const letterObj = {
			element: el,
			char: char,
			y: -50,
			speed: Math.random() * 2 + 1.5
		};
		document.getElementById('row-letters').appendChild(el);
		activeLetters.push(letterObj);
	} //end create_letter()

	function update_game() {
		if (isPaused) return;
		if ( misses >= 10 ) {
			resetGame();
		}	

		

		//Y-Movement
		for (let i = activeLetters.length - 1; 
			  i >= 0; i--) 
		{
			let l = activeLetters[i];
			l.y += Math.floor(l.speed);
			if(l.element && l.element.style) {
				l.element.style.transform = 
					`translateX(-50%) translateY(${l.y}px)`;
			}
			/* Here is where the letter 
			  passes the point of 
		  	  catching it with a key press */
			//get the height of the root style letter_height
			let r_s = 
			window.getComputedStyle(document.documentElement);				let y_divide=r_s.getPropertyValue('--letter_height');

			if (l.y > (y_divide + 40)) {
				let computedY = 0;
				if (l.el) {
					computedY = 
					l.el.style.left;
				} else {
					computedY = 
					        l.y || 'N/A';
				} //end if
				const realY  = 	Math.floor(computedY);
				l.element.remove();
				activeLetters.splice(i, 1);
				
				//Update scoreboard
				misses += 1;
				//update toaster value
			} //end if(l.y > last_good_yY)
		}//end for i
	}//end update_game

	window.addEventListener('keydown', (e) => {
	const keyPressed = e.key;

	function pause_game(){
		isPaused = true;
	}
	function resume_game() {
		isPaused = false;
	}
	function reset_game() {
		//score = 0;
		misses = 0;
	}


	const create_letter_interval = 1000;
	const update_game_interval = 75;


	setInterval(() => {
		if (!isPaused){

		}
	}, create_letter_interval);
	setInterval(() => {
		if (!isPaused){
			update_game();
		}
	}, update_game_interval);
