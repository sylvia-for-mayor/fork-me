<script>
	const container = document.querySelector('.container');

	var score = document.getElementById('score');
	var misses = document.getElementById('misses');
	var output = document.getElementById('output');
	console.log("output: ", output);

	//keyboard 
	const keys = document.getElementById('row-keys');
	const el = document.createElement('div');

	let bottomY = 0;
	var activeLetters = [];
		
	var letter;

	let randomLetter = ' ';
	let isPaused = false;
	


	const createLetterInterval = 30000;
	const updateGameInterval = 30000;

	function populate_keys() {
		const keys = document.getElementById('row-keys');
				//keyboard_el is defined in the top script
				//inspect console says it's not defined
		if (keys) {
				keyboard_el.forEach(item => {
				const new_div = document.createElement('div');	
					new_div.id = item.id;
					new_div.className = 'overlay-text';
					new_div.textContent = item.text;
					new_div.style.left = item.x + "px";
					new_div.style.top = item.y + "px";
					//hidden stops them from showing, 
					//for now lets see how they look
					//new_div.classList.add('hidden');
					keys.appendChild(new_div);
				}); //foreach keboard elemtent
		}//if keys
	} //end populate_keys
	/* And run it once */
	populate_keys(); 
	/************************************************/



	function create_letter() {
		if (isPaused) return;
		const matrix = [alpha, alpha_shift, numbers, numbers_shift, symbols];

		/* randomize which array to choose */
		const which = Math.floor(
			Math.random() 
			* matrix.length
		);
		const row = matrix[which];

		/* randomize element from 
		   that specific array */
		const index = Math.floor(
			Math.random() * row.length
		);
		element = row[index];
		output.text = output;

		/* assign the actual element just 
		randomized to randomLetter */
		randomLetter = element;
		let char = randomLetter;



		const el = document.createElement('div');
		el.classList.add('falling-letter');
		el.innerText = randomLetter;
		const xPos = Math.random() * (window.innerWidth - 100) + 50;
		el.style.left = `${xPos}px`;
		const letterObj = {
			element: el,
			char: char,
			y: -50,
			speed: Math.random() * 2 + 1.5
		};
		container.appendChild(el);
		activeLetters.push(letterObj);
	} //end create_letter()

	function update_game() {
		if (isPaused) return;

		if ( misses >= 10 ) {
			resetGame();
		}	
		for (let i = activeLetters.length - 1; 
			  i >= 0; i--) 
		{
			let l = activeLetters[i];
			l.y += Math.floor(l.speed);

			//A negative number coming in from l.y? 
			//console.log("Bottom ", l.y);
			l.element.style.top = `${l.y}px`;

			/* Here is where the letter 
			  passes the point of 
		  	  catching it with a key press */

			//The l.y is negative  Is this caused by the 
			//class in the script that defines the transform?
			console.log ("Bottom: ", bottomY);
			if (l.y > bottom) {

				if (l.el) {
					computedY = 
					l.el.style.left;
				} else {
					computedY = 
					        l.y || 'N/A';
				} //end if
				const realY  = 	Math.floor(computedY);
				l.element.remove();
				activeLetters.splice(i, 1);
				misses += 1;
			} //end if(l.y > bottomY)
		}//end for i
	}//end update_game

	window.addEventListener('keydown', (e) => {
	const keyPressed = e.key;

	});

		if (document.hidden) {
			pause_game();
		}
		else {
			resume_game();
		}
	}); 


	function pause_game(){
		isPaused = true;
	}
	function resume_game() {
		isPaused = false;
	}
	function reset_game() {
		score = 0;
		misses = 0;
	}
	setInterval(() => {
		if (!isPaused){
			create_letter();
		}
	}, create_letter);
	setInterval(() => {
		if (!isPaused){
			update_game();
		}
	}, update_game);
