	<style>
	:root {
		--container_width: 889px;
		--container_height: 668px;

		--letter_width: 889px;
		--letter_height: 428px;

		--keyboard_width: 889px;
		--keyboard_height: 240px;
		--brand_color1: #8A0303;
		--brand_color2: #C0C0C0;  /* brand grey (silver) */
		--brand_color3: #FFFFFF;
		--brand_color4: #000000;
		--brand_color5: #777777; /* purer grey for semi-opaque letters */
		--chosen_font_size: 3rem;
		--drift_char: -48;
		--floor: 380;
		--shift_right: 5;
		--fake: 1;  
			
	}
	.container {
		width: var(--container_width);
		height: var(--container_height);
		margin: 0 auto;
		background-color: var(--brand_color1) !important; 
		color: var(--brand_color2) !important;
		padding: 0;
		box-sizing: border-box;
		font-size: var(--chosen_font_size);
		display: block;
	}
	.row-letters {
		display: block;			 
		width: 100%
		width: var(--letter_width) !important;	
		height: var(--letter_height) !important;
		min-height: var(--letter_height) !important;
		background-color: var(--brand_color1);
		color: var(--brand_color2);
		text-align: center;		 
		font=size: var(--chosen_font_size);
		margin-top: 0px;
		margin-bottom: 0px;
		position: relative;
		z-index: 100;
		overflow: hidden;
	}	
	.row-keys {
		display: block;			 
		width: var(--keyboard_width) !important;	
		height: var(--keyboard_height) !important;
		min-height: var(--keyboard_height) !important;
		background-color: var(--brand_color2);
		text-align: center;		 
		margin-top: 0px;
		position: relative;
		font-size: var(--chosen_font_size);
	}
	.wrapper {
		display: flex;
		justify-content: center;
		align-items: stretch;
		width: 100%;
		min-height: 100vh;
	}
	.hidden {

		display: none;
	}
	.overlay-text {
		position: absolute;
		z-index: 10;
		color: var(--brand_color1);
		font-weight: bold;
		font-size: var(--chosen_font_size);
		font-size: 3rem;
		transform: translate(-50%, -50%);
		
	}
	.falling-letter {
		position: absolute;
		top: 50px;
		//font-size: var(--chosen_font_size);
		font-size: 3rem;
		font-weight: bold;
		color: black;
		color: var(--brand_color2);
		z-index: 999;
		display: inline-block;
	}

	let timer_interval = null;

	function start_countdown(seconds) {
		let context_time = seconds;
		let timer_display = document.getElementById("timer_display");

		if (!timer_display){
console.warn("⚠️ Error: 'timer_display' element not found in DOM yet!");
		        return;
    		}
		timer_display.innerHTML = context_time;

		timer_interval_id = setInterval(() => {
			context_time --;
			let liveSpan = document.getElementById("timer_display");
			if (liveSpan) {
				document.getElementById
					("timer_display")
					.innerHTML = context_time;
			}
			if (context_time <= 0){
				clearInterval(timer_interval_id);
				clearInterval(falling_interval_id);
				reset_game("Clock");
			}
		}, 1000);
	}
	

	class arcade_soring_system {
			constructor() {
		this.win_threshold_pct = 75;
		}
	evaluate() {
		try {
			const total = score + gremlin + toaster;
			if (total === 0) return;

			// Clear output vars (values)
			let user_pct	= Math.round((score / total) * 100);
			let gremlin_pct = Math.round((gremlin / total) * 100);
			let toaster_pct = Math.round((toaster / total) * 100);
 
			// Update percentage spans 
			if (document.getElementById('score-pct'))
				document.getElementById('score-pct')
				.textContent = user_pct + "%";
			if (document.getElementById('gremlin-pct')) 						document.getElementById('gremlin-pct')
				.textContent = gremlin_pct + "%";
			if (document.getElementById('toaster-pct')) 						document.getElementById('toaster-pct').
				textContent = toaster_pct + "%";

			//Milestone Check
			if (user_pct >= 75){
				reset_game("User");			
			}else if (toaster_pct >= 75) {
				reset_game("Toaster");
			} else if (gremlin_pct >= 75){
				reset_game("Gremlin");
			}

			if (total >= 10) {
				if (user_pct >= this.win_threshold_pct)
					if (typeof end_game === 'function')
						end_game("victory_knockout");
				if (gremlin_pct >= this.win_threshold_pct)   
					if (typeof end_game === 'function') 
						end_game("gremlin_knockout");
				if (toaster_pct >= this.win_threshold_pct)   
				if (typeof end_game === 'function') 
					end_game("toaster_knockout");
			}

		} catch (error) {
			console.warn(
			"Shut her down Clancey, she's pumping mud!!:", 
			error.message);
		}
	} //evaluate

	// Private helper mimicking clean encapsulation
	_update_display(element_id, value) {
		const el = document.getElementById(element_id);
		if (el) {
			// account for all possible field types
			// div span node form input etc.
			el.textContent = value;
			el.innerHTML = value;

			// If it's a form input node, 
			// update its value track too
			if ('value' in el) {
				el.value = value;
				}
			}
		}

		_trigger_match_resolution(outcome) {
			console.log
			(`Match concluded via rules engine: ${outcome}`);
			// Call your custom reset logic here
			if (typeof yourResetFunction === 'function') {
				reset_game("Rules");
			}
		}
	}
	// Instantiate the scoring system globally once
	const scoring_engine = new arcade_soring_system();


	function evaluate_arcade_match_rules(force_time_up = false) {
		console.log
		("evaluate_arcade_match_rules=>force_time_up getting press");
		try {
			const total = score + gremlin + toaster;
	
			// --- COUNTDOWN TIME-UP RESOLUTION (SUDDEN DEATH) ---
			if (force_time_up) {
				clearInterval(timer_interval);
			
				// Look for the highest score among the three
				let max_score = Math.max
					(score, gremlin, toaster);
			
				if (score === max_score) {
					alert("TIME UP! Victory on raw points!");
					if (typeof end_game === 'function') 
					end_game("victory_points");

				} else if (gremlin === max_score) {
				alert("TIME UP! Gremlin wins on points!");
				if (typeof end_game === 'function') 
					end_game("gremlin_loss");
				} else {
					alert
					("TIME UP! Toaster wins on points!");
					if (typeof end_game === 'function') 
					end_game("toaster_loss");
				}
				return;
			} //end if time up
		
  			// --- CONTINUOUS PERCENTAGE KNOCKOUT RULES ---
  			if (total < min_actions_required) return;
	
			let user_pct = Math.round((score / total) * 100);
			let gremlin_pct = Math.round((gremlin / total) * 100);
			let toaster_pct = Math.round((toaster / total) * 100);

			// Immediate Knockout criteria if someone 
			// captures threshold percent of the game space
			if (user_pct >= win_threshold_pct) {
				if (typeof end_game === 'function')
					end_game("victory_knockout");
			} else 
			if (gremlin_pct >= win_threshold_pct) {
				if (typeof end_game === 'function') 
					end_game("gremlin_knockout");
			} else if (toaster_pct >= win_threshold_pct) {
				if (typeof end_game === 'function')
					end_game("toaster_knockout");
			}
		} catch (e) {
			// Prevents silent thread death completely
			console.warn
			("Shut her down Clancey, she's pumping mud: ", e);
		}
	}

						keys.appendChild(new_div);
					}); //foreach keboard elemtent
			}//if keys
		*/
			/*************************************************/
	} // end populate_keys
	// And run it once 

	//Run once functions
	start_countdown(2400);
	populate_keys(); 

	function create_letter() {
		if (is_paused) return;

		//randomize which array to choose
		//(declared and populated in <head>)
		const which = Math.floor(
			Math.random() 
			* matrix.length
		);
		row = matrix[which];

		const index = Math.floor(Math.random() * row.length);
		elmts = row[index];

		// assign the actual element just 
		// randomized to random_letter 
		random_letter = elmts;
		let char = random_letter;

		var el = document.createElement('div');
		el.classList.add('falling-letter');
		el.innerText = random_letter;

		//left edge position for new falling letter
		let random_percent = Math.random() * 95;
		el.style.left = `${random_percent}%`;
		
		const letter_object = {
			element: el,
			char: char,
			y: -50,
			speed: Math.random() * 2 + 1.5
		};
		//push the new letter out to the "row-letters" div
		document.getElementById('row-letters').appendChild(el);
		active_letters.push(letter_object);
	} //end create_letter()

	function update_game() {
		if (is_paused) return;
		if ( toaster >= 300 ) {
			reset_game();
		}

		// Y-Movement 
		for (let i = active_letters.length - 1; i >= 0; i--) {
			let l = active_letters[i];
    	
			// Core falling math and transform application
			let active_speed = Number(l.speed) || 2; 
			l.y = (Number(l.y) || 0) + Math.floor(active_speed);
    	
			if (l.element && l.element.style) {
				l.element.style.transform = 
				`translateX(-50%) translateY(${l.y}px)`;
			}

			//Starts at 4 and increases until the
			//floor is only 200 (need a var for tolerance)
			//HERE MAGIC NUMBER
			let dynamic_floor = letter_height - 
				(stacked_floor_height * 4);
			if (dynamic_floor < 200) { 
				dynamic_floor = 200; 
			}
    
			// The stacking boundary condition check
			if (l.y > dynamic_floor) {
				// Visual Freeze: Change color and leave the 
				//frozen element on the screen
				if (l.element) {
					l.element.style.opacity = "0.5";
					l.element.style.color = brand_color5;
				}

				//Add character to deck array and
				//splice it from active_letters
				if (Array.isArray(elmts)) { 
					elmts.push(l.char); 
				}
        
				// Wipe out of falling active 
				//calculations array loop memory
				active_letters.splice(i, 1);
        
				//tick goes to global the rising floor
				stacked_floor_height += 1;
        	
				// Score 1 for the mighty toaster
				toaster += 1;
    
				// Evaluate live competitive score thresholds
				if (typeof scoring_engine !== 'undefined' && 
				typeof scoring_engine.evaluate === 
				'function')
				{
					scoring_engine.evaluate();
					evaluate_arcade_match_rules();
				}
			}//end if l.y > dynamic floor
		}//for
	}//end update_game() -- runs via interval

	window.addEventListener('keydown', (event) => {
		// 1. Core Safety Gates
		if (Date.now() - page_load_time < 2000) return; 
			if (event.repeat) return; 
			//anti-theft because the gremlin is evil
			//and steals the shift 15 times before the
			//user can press a key
			if (event.ctrlKey || event.altKey || event.metaKey) 
				return; 
			if (event.key.length !== 1) return; 

			// !!! FIX FOR THE SPACEBAR TRAP !!!
			// If Spacebar isn't part of your active 
			// matrix level, ignore it completely
			// Can the space be added now?
			// If I wait until I get to 'words'
			// level and have more a complicated implementation
			if (event.key === " ") {
				return; 
			}

			const pressed_key = event.key;
		
			// 2. Find the match
			const match_index = 
				active_letters.
				findIndex(letter_object => 
				letter_object.char === pressed_key);

			if (match_index !== -1) {
				const matched_letter =
					active_letters[match_index];
				matched_letter.element.remove();
				active_letters.splice(match_index, 1);
				score += 1; //user score
				scoring_engine.evaluate();
				evaluate_arcade_match_rules();
			} else {
				// gremlin score
				gremlin += 1;
				scoring_engine.evaluate();
				evaluate_arcade_match_rules();
			}
	});

	document.addEventListener("visibilitychange", () => {
		//use true/false provided with 
		//documenet to toggle
			is_paused = document.hidden;
	});

	//Not even sure if these are used.....
	function pause_game(){
			is_paused = true;
	}
	function resume_game() {
			is_paused = false;
	}

	function reset_game(champion) {
		total = 100;
		score = 33;
		toaster = 33;
		gremlin = 33;
		clearInterval(falling_interval_id);
		clearInterval(timer_interval_id);
		console.log(`🏆 MATCH OVER! Domination by: ${champion}`);
		console.log(`Game over loop triggered. Winner: ${champion}`);
	}


	var create_letter_interval = 2000;
	var update_game_interval = 100;

	setInterval(() => {
		if (!	is_paused){
			create_letter();
		}
	}, create_letter_interval);
	
	setInterval(() => {
		if (!	is_paused){
			update_game();
		}
	}, update_game_interval);






function update_active_keyboard_layout(allowedCharacters) {
    for (let asciiCode = 32; asciiCode <= 126; asciiCode++) {
        let char = String.fromCharCode(asciiCode);
        let elementId = convertCharacterToDivId(char);
        let keyElement = document.getElementById(elementId);
        
        if (!keyElement) continue;

        // Reset text content cleanly
        keyElement.innerHTML = "";
        
        if (allowedCharacters.includes(char)) {
            // UNHIDE FIREWALL: Use standard visibility rules instead of display blocks
            keyElement.style.visibility = "visible"; 
            keyElement.style.opacity = "1";
            
            // Inject the clean single string character character
            keyElement.innerHTML = char;
            keyElement.classList.add("keyboard-key-active");
            
            // Font balancing corrections
            if (char === "@") {
                keyElement.style.fontSize = "12px";
            } else if (char === "`") {
                keyElement.style.fontSize = "22px";
                keyElement.style.transform = "translateY(2px)";
            } else {
                keyElement.style.fontSize = "3rem";
                keyElement.style.transform = "none";
            }
        } else {
            // HIDE FIREWALL: Make the key character vanish without breaking coordinate space
            keyElement.style.visibility = "hidden";
            keyElement.style.opacity = "0";
            keyElement.classList.remove("keyboard-key-active");
        }
    }
}








function convertCharacterToDivId(char) {
    const structuralNamingOverrides = {
        ' ': 'div_space', '!': 'div_exclamation', '}': 'div_close_brace',
        '+': 'div_plus', '=': 'div_equals', '-': 'div_dash', '_': 'div_underscore',
        '.': 'div_period', ',': 'div_comma', '/': 'div_slash', '?': 'div_question',
        ';': 'div_semicolon', ':': 'div_colon', '`': 'div_backtick', '~': 'div_tilde',
        '#': 'div_hash', '$': 'div_dollar', '%': 'div_percent', '^': 'div_caret',
        '&': 'div_ampersand', '*': 'div_asterisk', '(': 'div_open_paren', ')': 'div_close_paren',
        '[': 'div_open_bracket', ']': 'div_close_bracket', '{': 'div_open_brace',
        '\\': 'div_backslash', '|': 'div_pipe', '"': 'div_quote', "'": 'div_apostrophe',
        '<': 'div_less_than', '>': 'div_greater_than'
    };

    if (structuralNamingOverrides[char]) {
        return structuralNamingOverrides[char];
    }
    
    // Capitalization Rule: Matches your HTML pattern where 'G' becomes 'div_g_upper'
    if (char >= 'A' && char <= 'Z') {
        return `div_${char.toLowerCase()}_upper`;
    }
    
    // Default fallback for numbers and standard lowercase letters (e.g., div_a, div_7)
    return `div_${char}`;
}
